<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Substudio · สตูดิโอคำบรรยาย</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101214;color:#f1f3ed;font:16px/1.6 "Leelawadee UI",Tahoma,sans-serif}header,main{max-width:1190px;margin:auto;padding:20px 5%}header{display:flex;align-items:center;gap:11px;border-bottom:1px solid #333639;font:bold 22px Arial}header i{font:800 16px Arial;letter-spacing:-1px;background:#ceef72;color:#171914;border-radius:6px;padding:7px}h1{font-size:clamp(30px,4vw,49px);margin:24px 0 0;letter-spacing:-1.5px}p{color:#adb2ad;margin:4px 0 26px}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start}section{min-width:0;border:1px solid #393c3e;border-radius:16px;background:#1b1d1f;padding:22px}h2{font-size:19px;margin:0 0 17px}.screen{background:repeating-linear-gradient(135deg,#151719 0 14px,#17191b 14px 15px);aspect-ratio:16/9;display:grid;place-items:center;border:1px solid #35383a;border-radius:9px;overflow:hidden;position:relative}.screen span{text-align:center;color:#aeb3ac}.screen b{display:block;margin:0 auto 10px;width:max-content;border:2px solid #858d81;border-radius:7px;padding:0 9px;color:#d1d8ca;font:bold 25px/1.4 Arial}canvas{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;background:#000}.bar{display:flex;gap:12px;align-items:center;margin-top:14px}.bar input{width:0;flex:1;accent-color:#cbee75}.time{font:13px monospace;color:#c6cbc5}button,.download{font:inherit;background:#ccec79;color:#17200c;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer}button:disabled{opacity:.42;cursor:default}.bar button{background:#323638;color:white;min-width:52px}.file{display:block;border:1px dashed #636958;background:#242825;padding:16px;border-radius:10px;cursor:pointer;position:relative;margin-bottom:12px}.file strong,.file small{display:block}.file small{color:#bcc3b6;overflow-wrap:anywhere}.file input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.file:focus-within{outline:2px solid #ceef72}#render,.download{width:100%;text-align:center;display:block;margin-top:16px}.download{text-decoration:none;background:#e6efd8}[hidden]{display:none!important}#status{font-size:14px;margin:12px 0 0;overflow-wrap:anywhere}.cues{margin-top:20px}.row{display:flex;gap:16px;padding:9px 0;border-top:1px solid #373a38;white-space:pre-line;text-align:left;width:100%;border-radius:0;background:none;color:#e4e7df;font-weight:400}.row time{font:13px/2 monospace;color:#ccec79}#rows{max-height:230px;overflow:auto}.note{font-size:14px;margin:12px 0 0}@media(max-width:780px){.grid{grid-template-columns:1fr}section{padding:17px}main{padding:12px 4%}}
</style><header><i>CC</i> Substudio</header><main><h1>สตูดิโอคำบรรยาย</h1><p>เลือกวิดีโอและไฟล์ SRT เพื่อฝังซับตามเวลาที่กำหนด</p><div class="grid"><div><section><h2>ตัวอย่างวิดีโอ</h2><div class="screen"><span><b>CC</b>รอไฟล์วิดีโอ</span><canvas hidden></canvas></div><div class="bar"><button id="play" disabled aria-label="เล่นหรือหยุด">▶</button><input id="seek" aria-label="ตำแหน่งวิดีโอ" type="range" value="0" min="0" step=".05" disabled><span class="time" id="clock">0:00 / 0:00</span></div></section><section class="cues"><h2 id="listTitle">คำบรรยาย</h2><div id="rows"><small>รายการจะแสดงเมื่อเลือกไฟล์ SRT</small></div></section></div><section><h2>ไฟล์ต้นฉบับ</h2><label class="file"><strong>เลือกวิดีโอ</strong><small id="vn">MP4, WebM หรือวิดีโอที่เบราว์เซอร์รองรับ</small><input id="vf" type="file" accept="video/*"></label><label class="file"><strong>เลือกไฟล์คำบรรยาย</strong><small id="sn">SubRip (.srt)</small><input id="sf" type="file" accept=".srt"></label><button id="render" disabled>ส่งออกวิดีโอพร้อมซับ ↓</button><a id="save" class="download" hidden>ดาวน์โหลดวิดีโอ</a><p id="status" role="status"></p><p class="note">ประมวลผลไฟล์บนเครื่องของคุณ เปิดแท็บนี้ไว้ระหว่างส่งออก ใช้เวลาประมาณความยาววิดีโอ</p></section></div><video hidden playsinline preload="auto"></video></main><script>
'use strict';
const $=id=>document.getElementById(id),v=document.querySelector('video'),c=document.querySelector('canvas'),ctx=c.getContext('2d');
let cues=[],ready=false,busy=false,sourceURL='',resultURL='',audioContext,audioSource,rec,frame=0,subVersion=0,aborted=false;
function stamp(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
function controls(){const finite=ready&&Number.isFinite(v.duration);$('play').disabled=$('seek').disabled=busy||!finite;$('render').disabled=busy||!finite||!cues.length;$('vf').disabled=$('sf').disabled=busy}
function clearResult(){if(resultURL)URL.revokeObjectURL(resultURL);resultURL='';$('save').hidden=true}
function parseSrt(raw){return raw.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').trim().split(/\n[ \t]*\n+/).map(block=>{
const lines=block.split('\n');if(/^\s*\d+\s*$/.test(lines[0]))lines.shift();
const m=(lines.shift()||'').match(/^\s*(\d+):(\d{2}):(\d{2})[,.](\d{1,3})\s*-->\s*(\d+):(\d{2}):(\d{2})[,.](\d{1,3})/);
if(!m||!lines.length)throw Error('รูปแบบ SRT ไม่ถูกต้อง กรุณาตรวจช่วงเวลาและข้อความ');const sec=i=>+m[i]*3600 + +m[i+1]*60 + +m[i+2] + Number('0.'+m[i+3]);const start=sec(1),end=sec(5);if(end<=start)throw Error('เวลาสิ้นสุดซับต้องมากกว่าเวลาเริ่ม');return {start,end,text:lines.join('\n').replace(/<\/?(?:b|i|u|font)(?:\s[^>]*)?>/gi,'')};
}).sort((a,b)=>a.start-b.start)}
function draw(){if(!ready||v.readyState<2)return;const w=c.width,h=c.height,t=v.currentTime;ctx.drawImage(v,0,0,w,h);
const active=cues.filter(q=>q.start<=t&&t<q.end);if(active.length){const size=Math.max(10,Math.min(h*.053,w*.078));ctx.font='bold '+size+'px "Leelawadee UI", Tahoma, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';const lines=[];
for(const q of active)for(const s of q.text.split('\n')){let line='';for(const ch of Array.from(s)){if(line&&ctx.measureText(line+ch).width>w*.88){lines.push(line);line=''}line+=ch}lines.push(line)}
lines.forEach((s,i)=>{let y=h*.91-(lines.length-1-i)*size*1.42;let width=ctx.measureText(s).width+size*.7;ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect((w-width)/2,y-size*.69,width,size*1.38);ctx.fillStyle='#fff';ctx.fillText(s,w/2,y)})}
$('seek').value=t;$('clock').textContent=stamp(t)+' / '+stamp(v.duration);if(busy)$('status').textContent='กำลังส่งออก '+Math.floor(t/v.duration*100)+'%'}
function loop(){draw();if(!v.paused&&!v.ended)frame=requestAnimationFrame(loop)}
v.onplay=()=>{if(audioContext)audioContext.resume();$('play').textContent='Ⅱ';cancelAnimationFrame(frame);loop()};v.onpause=()=>{$('play').textContent='▶';draw()};v.onseeked=v.onloadeddata=draw;
$('vf').onchange=()=>{const f=$('vf').files[0];if(!f)return;clearResult();ready=false;c.hidden=true;controls();v.pause();if(sourceURL)URL.revokeObjectURL(sourceURL);v.src=sourceURL=URL.createObjectURL(f);$('vn').textContent=f.name;$('status').textContent='กำลังอ่านวิดีโอ…'};
v.onloadedmetadata=()=>{ready=true;c.width=v.videoWidth;c.height=v.videoHeight;c.hidden=false;$('seek').max=v.duration;$('status').textContent=Number.isFinite(v.duration)?'':'ไม่พบความยาววิดีโอ กรุณาเลือกไฟล์ใหม่';controls();draw()};
v.onerror=()=>{ready=false;c.hidden=true;controls();if(busy){aborted=true;if(rec?.state==='recording')rec.stop()}$('status').textContent='อ่านวิดีโอไม่ได้ กรุณาลองไฟล์ MP4 หรือ WebM'};
$('sf').onchange=async()=>{const f=$('sf').files[0];if(!f)return;const version=++subVersion;clearResult();cues=[];controls();$('rows').replaceChildren();$('listTitle').textContent='คำบรรยาย';$('sn').textContent=f.name;try{const buf=await f.arrayBuffer();if(version!==subVersion)return;let raw;try{raw=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{raw=new TextDecoder(buf.byteLength>=2&&new Uint8Array(buf)[0]===255?'utf-16le':'windows-874').decode(buf)}cues=parseSrt(raw);$('listTitle').textContent='คำบรรยาย · '+cues.length;for(const q of cues){const b=document.createElement('button'),time=document.createElement('time');b.className='row';time.textContent=stamp(q.start);b.append(time,document.createTextNode(q.text));b.onclick=()=>{if(ready&&!busy)v.currentTime=Math.min(q.start,v.duration)};$('rows').append(b)}$('status').textContent='อ่านไฟล์คำบรรยายแล้ว'}catch(e){$('status').textContent=e.message}controls();draw()};
$('seek').oninput=e=>v.currentTime=Number(e.target.value);$('play').onclick=()=>{if(v.paused)v.play().catch(()=>{$('status').textContent='เล่นวิดีโอไม่ได้'});else v.pause()};
v.onended=()=>{if(busy&&rec?.state==='recording')rec.stop()};
$('render').onclick=async()=>{if(busy)return;clearResult();if(!window.MediaRecorder||!c.captureStream){$('status').textContent='โปรดใช้ Chrome หรือ Edge บนคอมพิวเตอร์เพื่อส่งออก';return}
busy=true;aborted=false;controls();v.pause();let stream,dest;const clean=()=>{stream?.getTracks().forEach(t=>t.stop());if(dest)audioSource.disconnect(dest);busy=false;rec=null;controls()};
try{audioContext??=new AudioContext();if(!audioSource){audioSource=audioContext.createMediaElementSource(v);audioSource.connect(audioContext.destination)}await audioContext.resume();if(v.currentTime!==0){await new Promise(resolve=>{v.addEventListener('seeked',resolve,{once:true});v.currentTime=0})}draw();stream=c.captureStream(30);dest=audioContext.createMediaStreamDestination();audioSource.connect(dest);stream.addTrack(dest.stream.getAudioTracks()[0]);const type=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t));rec=new MediaRecorder(stream,type?{mimeType:type}:{});const parts=[],mime=rec.mimeType;rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onerror=()=>{aborted=true;v.pause();$('status').textContent='ส่งออกไม่สำเร็จ กรุณาลองอีกครั้ง'};rec.onstop=()=>{if(!aborted&&parts.length){resultURL=URL.createObjectURL(new Blob(parts,{type:mime}));const a=$('save');a.href=resultURL;a.download=$('vf').files[0].name.replace(/\.[^.]+$/,'')+'-sub.'+(mime.includes('mp4')?'mp4':'webm');a.hidden=false;$('status').textContent='วิดีโอพร้อมดาวน์โหลดแล้ว'}clean()};rec.start(1000);await v.play()}catch(e){aborted=true;if(rec?.state==='recording')rec.stop();else clean();$('status').textContent='ส่งออกไม่สำเร็จ กรุณาลองใช้ Chrome หรือ Edge บนคอมพิวเตอร์'}};
</script></html>
